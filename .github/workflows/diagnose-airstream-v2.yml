name: Diagnose Airstream staging v2

on:
  push:
    branches:
      - chatgpt/airstream-repo-staging
    paths:
      - .github/workflows/diagnose-airstream-v2.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/airstream-repo-staging
          fetch-depth: 0

      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Run staging script and capture traceback
        id: stage
        shell: bash
        run: |
          set +e
          python tools/prepare_airstream_repository_v2.py > /tmp/airstream-v2.log 2>&1
          status=$?
          cat /tmp/airstream-v2.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/airstream-v2.log diagnostics/airstream-v2.log
          fi
          exit 0

      - name: Commit diagnostic when needed
        if: steps.stage.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/airstream-v2.log
          git commit -m "Record final Airstream staging traceback"
          git push origin HEAD:chatgpt/airstream-repo-staging

      - name: Fail when staging failed
        if: steps.stage.outputs.status != '0'
        run: exit 1
