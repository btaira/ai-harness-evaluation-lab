name: Prepare Airstream repository staging tree

on:
  push:
    branches:
      - chatgpt/airstream-repo-staging
    paths:
      - tools/prepare_airstream_repository.py
      - .github/workflows/prepare-airstream-repository.yml

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/airstream-repo-staging
          fetch-depth: 0

      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Download, assemble, and verify Airstream documents
        run: python tools/prepare_airstream_repository.py --stage-clean-tree

      - name: Commit the clean repository tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage complete Airstream document repository"
          git push origin HEAD:chatgpt/airstream-repo-staging
