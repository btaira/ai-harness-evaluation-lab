name: Unpack evaluation lab release
on:
  push:
    paths:
      - '.github/workflows/unpack-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify archive and extract source files
        shell: bash
        run: |
          set -euo pipefail
          unzip -t AI_Harness_Evaluation_Lab_v2.3.zip
          unzip -oq AI_Harness_Evaluation_Lab_v2.3.zip
          test -f index.html
          test -f AGENTS.md
          test -f lab-manifest.json
          test -f benchmark-prompts.json
          test -f harness-catalog.json
          test -f router-integration.json
          test -f mcp-sidecar/server.py
          python -m json.tool lab-manifest.json >/dev/null
          python -m json.tool benchmark-prompts.json >/dev/null
          python -m py_compile mcp-sidecar/server.py
          git rm AI_Harness_Evaluation_Lab_v2.3.zip
          git rm .github/workflows/unpack-release.yml
          git add index.html AGENTS.md lab-manifest.json benchmark-prompts.json harness-catalog.json router-integration.json mcp-sidecar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unpack AI Harness Evaluation Lab v2.3 source package"
          git push
