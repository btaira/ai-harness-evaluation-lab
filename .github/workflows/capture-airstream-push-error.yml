name: Capture Airstream staging push error

on:
  push:
    branches:
      - chatgpt/airstream-repo-staging
    paths:
      - .github/workflows/capture-airstream-push-error.yml

permissions:
  contents: write
  actions: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/airstream-repo-staging
          fetch-depth: 0

      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Build and verify clean tree
        run: python tools/prepare_airstream_repository_v2.py

      - name: Attempt commit and preserve any push error
        shell: bash
        run: |
          set -euo pipefail
          branch="chatgpt/airstream-repo-staging"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage complete Airstream document repository"
          set +e
          git push origin "HEAD:${branch}" > /tmp/airstream-push.log 2>&1
          status=$?
          set -e
          cat /tmp/airstream-push.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          mkdir -p diagnostics
          cp /tmp/airstream-push.log diagnostics/airstream-push.log
          git add diagnostics/airstream-push.log
          git commit -m "Record Airstream staging push error"
          git push origin "HEAD:${branch}"
          exit 1
