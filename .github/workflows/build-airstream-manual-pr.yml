name: Build and verify Airstream manual

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Download, merge, and verify the manual
        run: python tools/build_airstream_manual.py

      - name: Upload verified PDF and QA report
        uses: actions/upload-artifact@v4
        with:
          name: 1978-Airstream-Excella-500-Service-Manual
          path: |
            1978_Airstream_Excella_500_Service_Manual.pdf
            1978_Airstream_Excella_500_Service_Manual_QA.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit deliverables to the source branch
        shell: bash
        run: |
          set -euo pipefail
          target_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          pdf="1978_Airstream_Excella_500_Service_Manual.pdf"
          qa="1978_Airstream_Excella_500_Service_Manual_QA.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$qa"

          pdf_bytes=$(stat -c%s "$pdf")
          if [ "$pdf_bytes" -le 95000000 ]; then
            git add "$pdf"
          else
            echo "PDF is larger than the conservative GitHub commit limit; it remains available as a workflow artifact."
          fi

          if git diff --cached --quiet; then
            echo "No deliverable changes to commit."
          else
            git commit -m "Add verified combined Airstream service manual"
            git push origin "HEAD:${target_branch}"
          fi
