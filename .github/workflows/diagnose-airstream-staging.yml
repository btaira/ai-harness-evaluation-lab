name: Diagnose and prepare Airstream staging tree

on:
  push:
    branches:
      - chatgpt/airstream-repo-staging
    paths:
      - tools/prepare_airstream_repository.py
      - .github/workflows/diagnose-airstream-staging.yml

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/airstream-repo-staging
          fetch-depth: 0

      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Prepare documents and capture diagnostics
        id: prepare
        shell: bash
        run: |
          set +e
          python tools/prepare_airstream_repository.py --stage-clean-tree > /tmp/airstream-build.log 2>&1
          status=$?
          cat /tmp/airstream-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/airstream-build.log diagnostics/airstream-build.log
          fi
          exit 0

      - name: Commit the clean tree or diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "${{ steps.prepare.outputs.status }}" -eq 0 ]; then
            git commit -m "Stage complete Airstream document repository"
          else
            git commit -m "Record Airstream staging diagnostic"
          fi
          git push origin HEAD:chatgpt/airstream-repo-staging

      - name: Mark preparation failure
        if: steps.prepare.outputs.status != '0'
        run: exit 1
